syntax = "proto3";

package notification;

// Service definition for dispatching notifications
service NotificationService {
  // Remote Procedure Call to send an email notification
  rpc SendEmail (SendEmailRequest) returns (SendEmailResponse);
}

// The request payload for sending an email
message SendEmailRequest {
  string recipient = 1;
  string subject = 2;
  string message = 3;
}

// The response payload after attempting to send the email
message SendEmailResponse {
  bool success = 1;
  string message = 2;
}
